<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin tức - Khoa CNTT HUIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap: file local (ưu tiên) + CDN fallback -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'">
    <style>
        .news-card { transition: all 0.3s ease; }
        .news-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0, 84, 165, 0.2); }
        .filter-btn.active { background-color: #0054a5; color: white; }
        #newsSection { margin-top: 150px; padding-bottom: 60px; }
    </style>
</head>
<body data-theme="light">
    <div id="top-bar"></div>
    <div id="header"></div>

    <div class="container" id="newsSection">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">TIN TỨC & SỰ KIỆN</h1>
            <p class="lead text-muted">Những thông tin mới nhất từ Khoa Công nghệ Thông tin HUIT</p>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-7">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 Tìm kiếm tin tức...">
            </div>
            <div class="col-md-5">
                <div class="btn-group w-100 flex-wrap" id="filterButtons">
                    <button class="btn btn-outline-primary filter-btn active" data-filter="all">Tất cả</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="Học vụ">Học vụ</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="Sự kiện">Sự kiện</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="Tuyển dụng">Tuyển dụng</button>
                </div>
            </div>
        </div>

        <div class="row" id="newsContainer"></div>
    </div>

    <div id="right-pannel-placeholder"></div>
    <div id="chatbot"></div>
    <div id="footer-placeholder"></div>

    <script src="bootstrap/js/bootstrap.bundle.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js';document.head.appendChild(s);"></script>
    <script src="js/script.js"></script>
    <script src="js/component.js"></script>

    <script>
        let newsData = [];

        async function loadNews() {
            try {
                const res = await fetch('data/news.json');
                newsData = await res.json();
                renderNews(newsData);
            } catch (e) {
                console.error(e);
            }
        }

        function renderNews(data) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = data.map(news => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card news-card h-100">
                        <div class="card-body">
                            <span class="badge bg-primary mb-3">${news.type}</span>
                            <h5 class="card-title">${news.title}</h5>
                            <p class="text-muted small mb-2">${news.date}</p>
                            <p class="card-text">${news.desc}</p>
                        </div>
                        <div class="card-footer bg-light border-0">
                            <a href="chitiet-tintuc.html?id=${news.id}" class="btn btn-primary w-100">
                                <i class="fas fa-newspaper"></i> Đọc chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterNews() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

            const filtered = newsData.filter(news => {
                const matchSearch = news.title.toLowerCase().includes(searchText) ||
                                  (news.desc && news.desc.toLowerCase().includes(searchText));
                const matchFilter = activeFilter === 'all' || news.type === activeFilter;
                return matchSearch && matchFilter;
            });

            renderNews(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadNews();
            document.getElementById('searchInput').addEventListener('input', filterNews);
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterNews();
                });
            });
        });
    </script>
</body>
</html>
