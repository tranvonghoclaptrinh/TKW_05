<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Số - Khoa CNTT HUIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap: file local (ưu tiên) + CDN fallback -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'">
    <style>
        .library-card { transition: all 0.3s ease; }
        .library-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0, 84, 165, 0.15); }
        #librarySection { margin-top: 150px; padding-bottom: 60px; }
    </style>
</head>
<body data-theme="light">
    <div id="top-bar"></div>
    <div id="header"></div>

    <div class="container" id="librarySection">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">THƯ VIỆN TÀI LIỆU SỐ</h1>
            <p class="lead text-muted">Bộ sưu tập giáo trình và tài liệu chuyên ngành CNTT</p>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-7">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 Tìm tài liệu...">
            </div>
            <div class="col-md-5">
                <select id="categoryFilter" class="form-select form-select-lg">
                    <option value="all">Tất cả chuyên mục</option>
                </select>
            </div>
        </div>

        <div class="row" id="libraryContainer"></div>
    </div>

    <div id="right-pannel-placeholder"></div>
    <div id="chatbot"></div>
    <div id="footer-placeholder"></div>

    <script src="bootstrap/js/bootstrap.bundle.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js';document.head.appendChild(s);"></script>
    <script src="js/script.js"></script>
    <script src="js/component.js"></script>

    <script>
        let libraryData = [];

        async function loadLibrary() {
            try {
                const res = await fetch('data/library.json');
                libraryData = await res.json();
                populateCategories();
                renderLibrary(libraryData);
            } catch (e) {
                console.error(e);
            }
        }

        function populateCategories() {
            const categories = [...new Set(libraryData.map(item => item.category))];
            const select = document.getElementById('categoryFilter');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function renderLibrary(data) {
            const container = document.getElementById('libraryContainer');
            container.innerHTML = data.map(item => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card library-card h-100">
                        <div class="card-body">
                            <span class="badge bg-success mb-3">${item.category}</span>
                            <h5 class="card-title">${item.title}</h5>
                            <p class="text-muted"><strong>${item.author}</strong></p>
                            <p class="card-text">${item.desc}</p>
                        </div>
                        <div class="card-footer bg-light border-0">
                            <a href="chitiet-thuvien.html?id=${item.id}" class="btn btn-primary w-100">
                                <i class="fas fa-book-open"></i> Xem nội dung
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterLibrary() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const category = document.getElementById('categoryFilter').value;

            const filtered = libraryData.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(searchText) ||
                                  item.desc.toLowerCase().includes(searchText) ||
                                  item.author.toLowerCase().includes(searchText);
                const matchCat = category === 'all' || item.category === category;
                return matchSearch && matchCat;
            });

            renderLibrary(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLibrary();
            document.getElementById('searchInput').addEventListener('input', filterLibrary);
            document.getElementById('categoryFilter').addEventListener('change', filterLibrary);
        });
    </script>
</body>
</html>
